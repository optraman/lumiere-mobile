# ПАТЧ ПО ВОЗДУХУ: новый код уходит на сервер Expo, и установленный «Люмьер» подхватывает его сам —
# качает в фоне при запуске, включает со следующего запуска. Пара минут вместо получаса сборки.
#
# Доходит только то, что написано на TypeScript/JS, и картинки/шрифты. Новый нативный модуль,
# иконка, название, разрешения из app.json — это новый .ipa (см. ios-ipa.yml) с поднятой version.
name: Патч

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Что в патче (видно на expo.dev)'
        required: false
        default: 'Патч'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Что из ключей GitHub видит (сами значения не печатаются — только «есть / нет»).
      # Принимаются и секреты (Secrets), и переменные (Variables) репозитория — куда бы ни положили.
      - name: Ключи на месте?
        env:
          K_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
          K_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
          K_WYZIE_KEY: ${{ secrets.WYZIE_KEY || vars.WYZIE_KEY }}
        run: |
          for k in EXPO_TOKEN TMDB_API_KEY WYZIE_KEY; do
            v="K_$k"; if [ -n "${!v}" ]; then echo "✓ $k"; else echo "✗ $k — НЕТ"; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: .env из секретов
        run: |
          echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}" > .env
          echo "EXPO_PUBLIC_WYZIE_KEY=${{ secrets.WYZIE_KEY || vars.WYZIE_KEY }}" >> .env

      - name: Зависимости
        run: |
          npm ci --no-audit --no-fund
          # Та же версия модуля обновлений, что вшита в .ipa (см. ios-ipa.yml).
          npm install --no-audit --no-fund expo-updates@~57.0.24

      # ПРОЕКТ НА EXPO.DEV — САМ, БЕЗ ПОИСКА ID РУКАМИ. По токену EXPO_TOKEN `eas init` находит
      # проект lumiere-mobile в аккаунте (или создаёт его, если нет) и пишет его ID в app.json.
      # app.config.js на это время убирается: в него `eas init` писать не умеет. ID одинаков при
      # каждом запуске — это тот же проект. Если секрет EXPO_PROJECT_ID задан, берётся он.
      - name: Проект Expo
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::GitHub не видит EXPO_TOKEN. Он должен лежать в Settings РЕПОЗИТОРИЯ lumiere-mobile → Secrets and variables → Actions → вкладка Secrets → Repository secrets, имя ровно EXPO_TOKEN"; exit 1; }
          if [ -z "$EXPO_PROJECT_ID" ]; then
            mv app.config.js app.config.js.off
            npx --yes eas-cli@latest init --non-interactive --force
            mv app.config.js.off app.config.js
            EXPO_PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")
            echo "EXPO_PROJECT_ID=$EXPO_PROJECT_ID" >> "$GITHUB_ENV"
          fi
          echo "ID проекта Expo: $EXPO_PROJECT_ID"

      - name: Проверка типов
        run: npx tsc --noEmit

      # Текст патча — через переменную, а не прямо в команду: кавычки в нём не сломают строку.
      - name: Публикация
        env:
          MSG: ${{ github.event.inputs.message }}
        run: npx --yes eas-cli@latest update --channel production --platform ios --message "$MSG" --non-interactive
